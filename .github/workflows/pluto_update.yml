name: Update Pluto Playlists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pluto Provider Script
        run: python pluto_provider.py

      - name: Save Playlists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update Pluto Playlists" || exit 0
          git pull --rebase origin main || exit 0
          git push origin main || exit 0

          git push origin main || echo "Sem modificacoes para enviar"
