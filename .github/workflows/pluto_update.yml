name: Update Pluto Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Pluto Provider Script
        run: python pluto_provider.py

      - name: Generate Master Playlist
        run: python pluto_provider.py --merge

      - name: Save Playlists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update Pluto Playlists" || echo "Sem alteracoes para salvar"
          git pull --rebase origin main || echo "Sem atualizacoes remotas"
          git push origin main || echo "Sem modificacoes para enviar"
