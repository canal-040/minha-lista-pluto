name: Update Pluto TV List

on:
  schedule:
          - cron: '0 */6 * * *' # Runs at 0 minutes past the hour, every 6 hours

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Pluto TV Provider Script
        run: python pluto_provider.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add *.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Automated update of Pluto TV playlist"
            git push origin main
          else
            echo "No changes detected in the playlist."
          fi
